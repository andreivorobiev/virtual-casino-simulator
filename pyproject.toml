[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-casino-simulator"
version = "0.9.5.44"
description = "Local fake-money virtual casino simulator with isolated modules and GitHub/Codex governance."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["gunicorn>=23,<24", "Pillow>=10,<13"]

[project.optional-dependencies]
mysql = ["mysql-connector-python>=8.4"]
recovery = ["cryptography>=46,<50"]

[tool.setuptools.packages.find]
include = ["casino*", "modules*"]

[tool.setuptools.package-data]
modules = ["*.json"]

[tool.virtual_casino]
source_baseline = "9.1.0"
release_purpose = "Private-Invite Restricted Preview Update"
