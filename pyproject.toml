[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-casino-simulator"
version = "9.1.1"
description = "Local fake-money virtual casino simulator with isolated modules and GitHub/Codex governance."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[project.optional-dependencies]
mysql = ["mysql-connector-python>=8.4"]

[tool.setuptools.packages.find]
include = ["casino*", "modules*"]

[tool.setuptools.package-data]
modules = ["*.json"]

[tool.virtual_casino]
source_baseline = "9.1.0"
release_purpose = "Repository Bootstrap + Codex Migration Payload"
