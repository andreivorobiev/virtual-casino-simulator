<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Virtual Casino Simulator v9</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="casino-page">
  <!-- Premium shared shell: brand, route navigation, wallet, and add-token affordance. -->
  <header class="casino-topbar" data-testid="premium-topbar">
    <div class="brand-lockup">
      <div class="brand-mark" aria-hidden="true">&#9824;</div>
      <div class="brand-copy">
        <strong id="shell-brand-title">Virtual Casino Simulator</strong>
        <span id="shell-brand-subtitle">Play tokens only</span>
      </div>
    </div>
    <nav id="main-nav" class="casino-nav" aria-label="Primary"></nav>
    <div class="top-actions">
      <div class="wallet-pill" data-testid="premium-wallet">
        <span id="balance-label" class="wallet-label">Play token balance</span>
        <strong id="balance" class="wallet-amount">Loading...</strong>
      </div>
      <details class="wallet-menu">
        <summary id="wallet-menu-summary" class="icon-button" aria-label="Add play tokens"><span class="coin-stack" aria-hidden="true"></span></summary>
        <div class="wallet-popover">
          <label id="add-token-label" for="add-token-amount">Add play tokens</label>
          <div class="wallet-add-row">
            <input id="add-token-amount" type="number" value="1000" min="1">
            <button id="add-token-btn" class="primary" data-testid="add-tokens">Add</button>
          </div>
        </div>
      </details>
      <select id="shell-locale-select" class="shell-locale" data-testid="shell-locale-select" aria-label="Language"></select>
      <button id="logout-btn" class="icon-button profile-dot" type="button" aria-label="Logout" data-testid="logout"><span aria-hidden="true"></span></button>
    </div>
  </header>

  <!-- Main route outlet: lobby markup is rendered here and game modules mount here unchanged. -->
  <main id="view" class="screen lobby-screen"></main>

  <!-- Persistent status rail keeps play-token, ledger, app, player, and connection state visible. -->
  <footer id="shell-status" class="status-bar" data-testid="shell-status">
    <span class="status-item"><span id="status-safe-code" class="gold">SAFE</span><span id="status-safe-detail">All games use play tokens only</span></span>
    <span class="status-item"><span id="status-ledger-code" class="gold">LEDGER</span><span id="status-ledger-detail">Ledger-backed outcomes</span></span>
    <span class="status-item"><span id="status-app-code" class="gold">APP</span><span id="status-version">Loading</span></span>
    <span class="status-item"><span id="status-players-code" class="gold">PLAYERS</span><span id="status-players">0 online</span></span>
    <span class="status-item"><span id="connection-dot" class="status-dot"></span><span id="connection-status">Connecting</span></span>
  </footer>

  <!-- Toasts remain outside the route outlet so navigation never destroys feedback. -->
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
