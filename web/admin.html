<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Virtual Casino Admin</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-body">
  <!-- Admin shell: sidebar navigation and dense control-plane workspace. -->
  <main id="admin" class="admin-shell">
    <!-- Sidebar: stable Admin tabs with data-i18n hooks for browser-local language switching. -->
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <div class="logo">A</div>
        <div>
          <h2 data-i18n="brand.title" data-i18n-domain="admin">Admin</h2>
          <small data-i18n="brand.subtitle" data-i18n-domain="admin">Local control plane</small>
        </div>
      </div>
      <button data-tab="dashboard" class="gold" data-testid="admin-tab-dashboard" data-i18n="nav.dashboard" data-i18n-domain="admin">Dashboard</button>
      <button data-tab="players" data-testid="admin-tab-players" data-i18n="nav.players" data-i18n-domain="admin">Players & Bots</button>
      <button data-tab="users" data-testid="admin-tab-users" data-i18n="nav.users" data-i18n-domain="admin">Users</button>
      <button data-tab="invitations" data-testid="admin-tab-invitations" data-i18n="nav.invitations" data-i18n-domain="admin">Invitations</button>
      <button data-tab="guests" data-testid="admin-tab-guests" data-i18n="nav.guests" data-i18n-domain="admin">Guest Trials</button>
      <button data-tab="feedback" data-testid="admin-tab-feedback" data-i18n="feedback.admin.title" data-i18n-domain="feedback">Problem Reports</button>
      <button data-tab="ledger" data-i18n="nav.ledger" data-i18n-domain="admin">Ledger</button>
      <button data-tab="history" data-i18n="nav.history" data-i18n-domain="admin">History</button>
      <button data-tab="telemetry" data-i18n="nav.telemetry" data-i18n-domain="admin">Telemetry</button>
      <button data-tab="operations" data-testid="admin-tab-operations" data-i18n="nav.operations" data-i18n-domain="admin">Operations</button>
      <button data-tab="states" data-i18n="nav.states" data-i18n-domain="admin">Game States</button>
      <button data-tab="audio" data-testid="admin-tab-audio" data-i18n="nav.audio" data-i18n-domain="admin">Audio & Voice</button>
      <button data-tab="language" data-testid="admin-tab-language" data-i18n="nav.language" data-i18n-domain="admin">Language / Locale</button>
      <button data-tab="autoplay" data-testid="admin-tab-autoplay" data-i18n="nav.autoplay" data-i18n-domain="admin">Autoplay</button>
      <button data-tab="requirements" data-i18n="nav.requirements" data-i18n-domain="admin">Requirements</button>
      <button data-tab="tests" data-i18n="nav.tests" data-i18n-domain="admin">Tests</button>
      <button data-tab="system" data-i18n="nav.system" data-i18n-domain="admin">System</button>
      <hr>
      <button id="backToCasino" data-i18n="actions.backToCasino">Back to Casino</button>
    </aside>
    <!-- Main workspace: current tab heading plus rendered Admin content. -->
    <section class="admin-main">
      <div class="admin-top">
        <div>
          <h1 id="adminTitle">Dashboard</h1>
          <p id="adminSubtitle" class="muted">Telemetry and controls for your local play-token casino.</p>
        </div>
        <button id="refreshAdmin" data-testid="admin-refresh" data-i18n="actions.refresh">Refresh</button>
      </div>
      <div id="adminView" class="admin-content" data-i18n="status.loading">Loading...</div>
    </section>
  </main>
  <script type="module" src="/admin.js"></script>
</body>
</html>
