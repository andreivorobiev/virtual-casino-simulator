          type: string
          enum: [google, facebook]
        available:
          type: boolean
        linked:
          type: boolean
    OAuthStartRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [signin, link, signup]
        return_to:
          type: string
          pattern: '^/(?:$|games/[a-z0-9][a-z0-9_-]{0,63})$'
          default: '/'
        confirm_link:
          type: boolean
          description: Must be exactly true for link and never selects a user.
        terms_version:
          type: string
          enum: [private-beta-1]
          description: Required only for signup and bound to the one-time flow.
        accepted_terms:
          type: boolean
          enum: [true]
          description: Required only for signup.
        accepted_privacy:
          type: boolean
          enum: [true]
          description: Required only for signup.
        accepted_fake_money:
          type: boolean
          enum: [true]
          description: Required only for signup and confirms balances have no cash value.
        locale:
          type: string
          enum: [en-US, ru-RU]
          description: Required only for signup.
    OAuthStartResult:
      type: object
      required: [provider, action, authorization_url, expires_in]
