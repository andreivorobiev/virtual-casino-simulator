      type: object
      description: Native-only issuance wire shape; the OS bridge removes bearer, CSRF, and guest proof fields before exposing the envelope to shared JavaScript.
      required: [user, player, session, terms, session_status]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        player:
          $ref: '#/components/schemas/PlayerSummary'
        session:
          $ref: '#/components/schemas/NativeIssuedSession'
        terms:
          $ref: '#/components/schemas/TermsStatus'
        session_status:
          $ref: '#/components/schemas/SessionStatusSummary'
