openapi: 3.0.3
info:
  title: Virtual Casino auth and current-user API
  version: v2
  description: Additive v2 contract for authenticated private-invite play, guest trials, verified-email pending signup and invitation redemption, current-user state, terms acceptance, play-token balance flows, and disabled-by-default provider linking and sign-in.
servers:
  - url: /api/v2
x-casino-enrollment-policy:
  revision: 5
  enforced_routes: [/api/v2/auth/signup, /api/v2/auth/redeem-invitation, /api/v2/auth/oauth/{provider}/start, /api/v2/auth/oauth/{provider}/callback]
  absent-nonmapping-or-unowned-document: deployed-environment-baseline
  schema-v1-malformed-document: fixed-operator-recovery-without-read-side-write
  schema-v1-unknown-mode: fixed-operator-recovery-without-read-side-write
  decision_logging: operational-jsonl
  logging_failure: deny-before-mutation
  owner_admin_routes: [/api/v2/admin/enrollment-policy, /api/v2/admin/enrollment-policy/preview]
  owner_role: platform_owner
  owner_change_confirmation: exact-true-plus-bounded-reason
  owner_preview_binding: canonical-policy-plus-audit-count-and-head-sha256
  owner_stale_preview: fixed-conflict-without-write-or-log
  immutable_actor_change_audit: provider-backed-hash-linked-policy-transaction
  live_enablement_authorized: false
  api_v1_unchanged: true
paths:
  # Guest entry is repository-only restricted-preview behavior and does not authorize public launch.
  /auth/guest:
    post:
      summary: Create a disposable account-free guest trial after explicit current-version terms acceptance.
      operationId: auth_v2_guest_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestTrialRequest'
      responses:
        '200':
          description: Standard API envelope carrying the guest principal and one-time browser-context proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAuthEnvelope'
        '400':
          description: Current guest-trial terms were not explicitly accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Guest trials are disabled or the bounded guest capacity is full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/guest/end:
    post:
      summary: Irreversibly end the authenticated guest trial and revoke resumable state.
      operationId: auth_v2_guest_end
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/GuestBrowserNonce'
      responses:
        '200':
          description: Standard API envelope confirming irreversible guest teardown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestLifecycleEnvelope'
        '401':
          description: Guest credential or browser-context proof is absent, expired, or not resumable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The authenticated principal is not a guest trial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/guest/depart:
    post:
      summary: Record a best-effort guest page departure while allowing same-context reload.
      operationId: auth_v2_guest_depart
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/GuestBrowserNonce'
      responses:
        '200':
          description: Standard API envelope confirming the lifecycle marker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestLifecycleEnvelope'
        '401':
          description: Guest credential or browser-context proof is absent, expired, or not resumable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The authenticated principal is not a guest trial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/enrollment-policy:
    get:
      summary: Publish the closed-vocabulary enrollment mode plus disabled-by-default feature availability.
      operationId: auth_v2_enrollment_policy
      responses:
        '200':
          description: Standard API envelope carrying the enrollment mode and boolean first-party feature gates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPolicyEnvelope'
  /auth/csrf:
    get:
      summary: Re-issue the anonymous host-only double-submit cookie so a cookie-less sign-in surface can recover without a shell reload.
      operationId: auth_v2_csrf_bootstrap
      responses:
        '200':
          description: Empty standard envelope; the recovered value travels only in the Set-Cookie header, never the response body.
  /auth/signup:
    post:
      summary: Begin account-free verified-email enrollment only when policy and transactional mail are ready.
      operationId: auth_v2_signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Generic pending-verification acknowledgement; no account, player, balance, or session exists yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupPendingEnvelope'
        '400':
          description: Standard envelope for invalid email, password, locale, terms, or unsupported account fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The resolved enrollment policy denies signup or its operational decision cannot be logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/signup/resend:
    post:
      summary: Replace a pending email-verification bearer with an enumeration-safe acknowledgement.
      operationId: auth_v2_signup_resend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupResendRequest'
      responses:
        '200':
          description: Identical pending acknowledgement regardless of recipient lookup outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupPendingEnvelope'
  /auth/signup/verify:
    post:
      summary: Consume a purpose-bound bearer and recoverably provision, ledger-fund, then activate an account without a session.
      operationId: auth_v2_signup_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupVerifyRequest'
      responses:
        '200':
          description: Identifier-free activation receipt; the client must sign in explicitly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupVerifiedEnvelope'
        '400':
          description: Generic rejection for malformed, expired, consumed, cancelled, mismatched, or unavailable verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/signup/cancel:
    post:
      summary: Revoke one pending verification generation only with its current delivered bearer.
      operationId: auth_v2_signup_cancel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCancelRequest'
      responses:
        '200':
          description: Terminal cancellation receipt after current-bearer ownership proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupCancelledEnvelope'
        '400':
          description: Generic rejection for absent, malformed, stale, revoked, candidate, cross-recipient, rate-limited, or raced cancellation ownership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/password-reset/initiate:
    post:
      summary: Request an enumeration-safe first-party password recovery message.
      operationId: auth_v2_password_reset_initiate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetInitiateRequest'
      responses:
        '200':
          description: Identical generic acknowledgement regardless of account existence or delivery outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetAcceptedEnvelope'
        '400':
          description: The request contains unsupported fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/password-reset/resend:
    post:
      summary: Replace any prior active recovery bearer while retaining the same generic acknowledgement.
      operationId: auth_v2_password_reset_resend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetInitiateRequest'
      responses:
        '200':
          description: Identical generic acknowledgement regardless of account existence or delivery outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetAcceptedEnvelope'
  /auth/password-reset/complete:
    post:
      summary: Consume one purpose-bound recovery bearer, rotate the local password, and revoke predecessor sessions.
      operationId: auth_v2_password_reset_complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompleteRequest'
      responses:
        '200':
          description: Generic completion with no credential or bearer material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetCompleteEnvelope'
        '400':
          description: Generic rejection for malformed, weak, expired, consumed, revoked, mismatched, or unavailable recovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/oauth/providers:
    get:
      summary: Inspect disabled OAuth provider configuration through the Admin role gate.
      operationId: auth_v2_admin_oauth_providers
      security:
        - cookieSession: []
      responses:
        '200':
          description: Standard API envelope carrying secret-safe provider diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderDiagnosticsEnvelope'
        '401':
          description: Standard API envelope for an unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Standard API envelope for an authenticated non-Admin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  # Public provider status contains booleans only and never configuration or credential fields.
  /auth/oauth/providers:
    get:
      summary: List boolean-only Google and Facebook sign-in and signup availability.
      operationId: auth_v2_oauth_public_providers
      responses:
        '200':
          description: Standard envelope with no credentials, client identifiers, callbacks, or configuration diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthPublicProvidersEnvelope'
  # Start is inert unless provider configuration and its independent network-release latch are both ready.
  /auth/oauth/{provider}/start:
    post:
      summary: Start provider sign-in, explicit linking, or separately gated acknowledged signup.
      operationId: auth_v2_oauth_start
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthStartRequest'
      responses:
        '200':
          description: Standard envelope carrying a short-lived authorization navigation URL that clients must not log or persist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStartEnvelope'
        '400':
          description: Standard envelope for invalid action, confirmation, acknowledgement, locale, or return path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Linking requires an authenticated canonical Casino session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Browser/session CSRF binding, local-password linking authority, or provider-specific signup policy is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Provider is disabled, incomplete, independently release-held, or unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: OAuth-specific durable attempt rate was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  # Callback consumes one recoverably claimed browser-bound flow and returns no provider response body.
  /auth/oauth/{provider}/callback:
    get:
      summary: Complete or recover one prior browser-bound provider sign-in, link, or signup action.
      operationId: auth_v2_oauth_callback
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '303':
          description: Safe same-origin completion redirect; successful sign-in also sets hardened session and CSRF cookies.
          headers:
            Location:
              schema:
                type: string
                pattern: '^/(?:\?|games/)'
        '400':
          description: Standard envelope for duplicate, ambiguous, or malformed callback parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Standard envelope for state, binding, expiry, replay, token, identity, or prelink failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Browser ownership, linking-session ownership, or private-invite authorization is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Provider is disabled, incomplete, independently release-held, or unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: OAuth-specific durable callback rate was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Secret-safe transient provider failure; the same flow remains retryable within its original expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  # Current-user link status never returns provider subjects or canonical identifiers.
  /me/oauth/providers:
    get:
      summary: List boolean-only provider availability and link state for the current persistent user.
      operationId: auth_v2_oauth_links
      security:
        - cookieSession: []
      responses:
        '200':
          description: Standard envelope without provider subjects, claims, or canonical identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthLinksEnvelope'
        '401':
          description: Standard envelope for an unauthenticated or disposable guest request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  # Unlink preserves local-password recovery and revokes sessions authenticated by that provider.
  /me/oauth/{provider}/unlink:
    post:
      summary: Explicitly unlink one provider while preserving local-password recovery.
      operationId: auth_v2_oauth_unlink
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthUnlinkRequest'
      responses:
        '200':
          description: Standard envelope with idempotent boolean unlink state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUnlinkEnvelope'
        '400':
          description: Standard envelope when explicit confirmation is absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Standard envelope for an unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Standard envelope when safe local-password recovery is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      summary: Create an authenticated private beta session.
      operationId: auth_v2_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Standard API envelope carrying the authenticated session summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '401':
          description: Standard API envelope carrying an authentication error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      summary: Revoke the current authenticated session.
      operationId: auth_v2_logout
      security:
        - cookieSession: []
      responses:
        '200':
          description: Standard API envelope confirming logout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
  /auth/session:
    get:
      summary: Inspect the current authenticated session without mutating it.
      operationId: auth_v2_session
      security:
        - cookieSession: []
      responses:
        '200':
          description: Standard API envelope carrying current session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '401':
          description: Standard API envelope carrying an authentication error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  # Native session probes are enabled only for an exact configured Capacitor Origin and OS-vault bearer.
  /auth/mobile/session:
    get:
      summary: Revalidate a native OS-vault bearer with identifier-free session metadata.
      operationId: auth_v2_mobile_session_probe
      security:
        - nativeBearer: []
      responses:
        '200':
          description: Minimal authenticated state with no bearer, CSRF, account, player, wallet, or guest proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeSessionProbeEnvelope'
        '401':
          description: The native bearer is absent, stale, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The native marker or exact configured Capacitor Origin is absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/mobile/session/rotate:
    post:
      summary: Atomically replace a native bearer and matching CSRF pair under server session generation.
      operationId: auth_v2_mobile_session_rotate
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeSessionRotationRequest'
      responses:
        '200':
          description: The native plugin must commit and strip the issued bearer and CSRF before JavaScript receives the remaining current-user envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeSessionIssuedEnvelope'
        '409':
          description: Generation, predecessor bearer, or session identity changed; the client must sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/mobile/session/revoke:
    post:
      summary: Revoke the exact native Authorization bearer before OS-vault clear or account switch.
      operationId: auth_v2_mobile_session_revoke
      security:
        - nativeBearer: []
      responses:
        '200':
          description: Identifier-free revocation acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeSessionRevokedEnvelope'
        '401':
          description: The predecessor bearer is already absent, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/terms/accept:
    post:
      summary: Record private beta toy-simulator terms acceptance for the current user.
      operationId: auth_v2_accept_terms
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermsAcceptanceRequest'
      responses:
        '200':
          description: Standard API envelope carrying the updated terms status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsEnvelope'
  /me:
    get:
      summary: Return the authenticated user, roles, terms status, locale, and bound player summary.
      operationId: auth_v2_get_me
      security:
        - cookieSession: []
      responses:
        '200':
          description: Standard API envelope carrying current-user state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401':
          description: Standard API envelope carrying an authentication error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /me/passkeys:
    get:
      summary: Return disabled passkey readiness for the current user's My Settings surface.
      operationId: auth_v2_me_passkeys
      security:
        - cookieSession: []
      responses:
        '200':
          description: Standard API envelope carrying no credential material while passkeys are disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyStatusEnvelope'
        '401':
          description: Standard API envelope carrying an authentication error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /me/passkeys/register:
    post:
      summary: Fail closed until a certified WebAuthn registration ceremony is implemented.
      operationId: auth_v2_me_passkeys_register
      security:
        - cookieSession: []
      responses:
        '403':
          description: Passkey registration is disabled by default.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /me/convert-guest:
    post:
      summary: Explicitly convert the authenticated guest trial into a durable first-party account.
      operationId: auth_v2_me_convert_guest
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestConversionRequest'
      responses:
        '200':
          description: Standard API envelope carrying conversion status and wallet-preservation proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestConversionEnvelope'
        '400':
          description: Conversion requires an active guest, valid account fields, and explicit terms acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The guest wallet was already adopted by a different account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /me/tokens/add:
    post:
      summary: Request a ledger-backed play-token credit for an authenticated registered user's bound player.
      description: Guest-trial principals are forbidden because their disposable 10,000-token grant cannot be increased, purchased, deposited, transferred, or restored.
      operationId: auth_v2_add_current_user_tokens
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTokensRequest'
      responses:
        '200':
          description: Standard API envelope carrying the updated player token balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerEnvelope'
        '403':
          description: Guest-trial principals cannot increase their temporary wallet balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, facebook]
    GuestBrowserNonce:
      name: X-Guest-Browser-Nonce
      in: header
      required: true
      description: One-time browser-context proof kept only in sessionStorage and required with a guest cookie.
      schema:
        type: string
        minLength: 32
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: casino_session
    nativeBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque OS-vault session credential
  schemas:
    NativeSessionRotationRequest:
      type: object
      required: [expected_generation]
      additionalProperties: false
      properties:
        expected_generation:
          type: integer
          minimum: 1
          description: Server session generation supplied only from native secure storage.
    NativeSessionProbeEnvelope:
      type: object
      required: [ok, data]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [authenticated, session]
          additionalProperties: false
          properties:
            authenticated:
              type: boolean
              enum: [true]
            session:
              type: object
              required: [generation, issued_at, expires_at, status]
              additionalProperties: false
              properties:
                generation:
                  type: integer
                  minimum: 1
                issued_at:
                  type: string
                  format: date-time
                expires_at:
                  type: string
                  format: date-time
                status:
                  type: string
                  enum: [active]
    NativeSessionIssuedEnvelope:
      type: object
      required: [ok, data]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/NativeIssuedCurrentUser'
    NativeSessionRevokedEnvelope:
      type: object
      required: [ok, data]
      additionalProperties: false
