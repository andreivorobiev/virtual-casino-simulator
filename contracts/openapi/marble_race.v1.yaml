openapi: 3.0.3
# Describe the additive issue-157 Marble Race contract without changing existing v1 operations.
info:
  title: Virtual Casino Marble Race API
  version: v1
  description: Additive session-bound Marble Race contract for issue 157, built on the shared exactly-once settlement core.
# Define only game-owned routes; shared router registration remains with issue 77.
paths:
  # Expose session-owned reload state and immutable bet metadata.
  /api/v1/games/marble-race/state:
    get:
      summary: Read the authenticated player's Marble Race bet catalog and recent settled races
      operationId: marble_race_GET_api_v1_games_marble_race_state
      responses:
        '200':
          description: Standard success envelope containing game state, player snapshot, and bet catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarbleStateEnvelope'
        '401':
          description: Standard error envelope when no authenticated session is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  # Execute one complete debit, race, and optional settlement action.
  /api/v1/games/marble-race/races:
    post:
      summary: Execute or replay one atomic ledger-backed Marble Race
      operationId: marble_race_POST_api_v1_games_marble_race_races
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarbleRaceRequest'
      responses:
        '200':
          description: Standard success envelope containing one settled or safely replayed round
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarbleRaceEnvelope'
        '400':
          description: Standard error envelope for an invalid bet, marble, or stake or request identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Standard error envelope when no authenticated session is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '409':
          description: Standard error envelope when one request identity is reused with different wager content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
# Keep all request, response, round, and standard-envelope shapes local to this contract.
components:
  schemas:
    # Require a caller-stable action identity, a market, a marble, and a bounded stake.
    MarbleRaceRequest:
      type: object
      additionalProperties: false
      required: [request_id, bet, marble, stake]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Stable caller-generated identity reused only when retrying the same race action.
        player_id:
          type: string
          description: Compatibility field overridden by the authenticated session-bound player resolver.
        bet:
          type: string
          enum: [win, podium]
        marble:
          type: integer
          minimum: 0
          maximum: 5
          description: Zero-based index of the backed marble.
        stake:
          type: integer
          minimum: 1
          maximum: 100000
          description: Fake-money play-token stake; never currency or redeemable value.
    # Specialize the standard success envelope for state reads.
    MarbleStateEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MarblePayload'
    # Specialize the standard success envelope for atomic race actions.
    MarbleRaceEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/MarblePayload'
                - type: object
                  required: [round, replayed, ledger]
                  properties:
                    round: {$ref: '#/components/schemas/MarbleRound'}
                    replayed: {type: boolean}
                    ledger: {$ref: '#/components/schemas/MarbleLedgerEvidence'}
    # Describe the common state, player, and immutable bet metadata payload.
    MarblePayload:
      type: object
      required: [game, state, player, bet_catalog]
      properties:
        game: {type: string, enum: [marble_race]}
        state: {type: object}
        player:
          type: object
          description: Current authenticated player's shared read-only wallet snapshot.
        bet_catalog:
          type: object
          description: Marbles, podium size, and the win and podium multipliers.
    # Describe one immutable settled round returned on original and replayed requests.
    MarbleRound:
      type: object
      required: [round_id, wager, wager_total, entropy, total_return, outcome, detail, net, settled_at]
      properties:
        round_id: {type: string}
        wager:
          type: object
          required: [bet, marble, stake]
          properties:
            bet: {type: string, enum: [win, podium]}
            marble: {type: integer, minimum: 0, maximum: 5}
            stake: {type: integer, minimum: 1}
        wager_total: {type: number, minimum: 0.01}
        entropy:
          type: object
          required: [order]
          properties:
            order:
              type: array
              minItems: 6
              maxItems: 6
              items: {type: integer, minimum: 0, maximum: 5}
        total_return: {type: number, minimum: 0}
        outcome: {type: string, enum: [win, lose]}
        detail:
          type: object
          required: [order, winner, podium]
          properties:
            order:
              type: array
              minItems: 6
              maxItems: 6
              items: {type: integer, minimum: 0, maximum: 5}
            winner: {type: integer, minimum: 0, maximum: 5}
            podium:
              type: array
              minItems: 3
              maxItems: 3
              items: {type: integer, minimum: 0, maximum: 5}
        net: {type: number}
        settled_at: {type: string}
    # Preserve scoped wager and optional return event evidence for the settled round.
    MarbleLedgerEvidence:
      type: object
      required: [wager, settlement]
      properties:
        wager:
          type: object
          description: Committed aggregate wager debit for this authenticated player and round.
        settlement:
          type: object
          nullable: true
          description: Committed aggregate return credit, or null when the race lost.
    # Preserve the repository-wide success envelope contract.
    ApiSuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, enum: [true]}
        data: {type: object}
    # Preserve the repository-wide error envelope contract.
    ApiErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: {type: boolean, enum: [false]}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object}
