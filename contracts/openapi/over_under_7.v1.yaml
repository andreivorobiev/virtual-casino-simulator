openapi: 3.0.3
info:
  title: Over/Under 7 Additive Game API
  version: 1.0.0
  description: >
    Accepted game-owned additive v1 contract for catalog-integrated Over/Under 7.
    Authenticated session binding owns player identity and all token movement uses the shared ledger.
paths:
  /api/v1/games/over-under-7/state:
    get:
      summary: Read the authenticated player's Over/Under 7 state.
      operationId: overUnder7State
      responses:
        "200":
          description: Standard success envelope containing game state, player snapshot, and paytable rules.
  /api/v1/games/over-under-7/plays:
    post:
      summary: Execute or replay one ledger-backed two-dice proposition play.
      operationId: overUnder7Play
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action_id
                - wagers
              properties:
                action_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: "^[A-Za-z0-9._:-]+$"
                wagers:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    under:
                      type: number
                      minimum: 0.01
                    seven:
                      type: number
                      minimum: 0.01
                    over:
                      type: number
                      minimum: 0.01
      responses:
        "200":
          description: Standard success envelope containing the settled round, replay flag, ledger evidence, state, player, and rules.
        "400":
          description: Standard error envelope for malformed wagers or action ids.
        "409":
          description: Standard error envelope for conflicting action-id reuse.
