openapi: 3.0.3
info:
  title: Virtual Casino personal settings, self-history, receipts, and wellness API
  version: v2
  description: Additive authenticated self-service foundation for locale, sound, bounded ledger-backed personal history, ledger-derived play-token receipts, opt-in wellness preferences, and neutral active-session summaries. Subjects and session boundaries always come from server-owned context; caller-authored user, player, or session identifiers are never accepted.
servers:
  - url: /api/v2
paths:
  /me/settings:
    get:
      summary: Read the active session's personal preferences and supported locale catalog.
      operationId: user_settings_v2_read
      security:
        - cookieSession: []
      responses:
        '200':
          description: Canonical settings and supported locales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsReadEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      summary: Atomically update allowlisted preferences for the active session subject.
      operationId: user_settings_v2_update
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Canonical stored settings after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsUpdateEnvelope'
        '400':
          description: Malformed, empty, unsupported-locale, or non-allowlisted update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Supplied revision is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /me/history:
    get:
      summary: Read one bounded newest-first page of the active session's own ledger-backed activity.
      operationId: user_settings_v2_history
      security:
        - cookieSession: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: game
          in: query
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: Self-only activity with privacy-safe display references and pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /me/receipts:
    get:
      summary: Read one bounded newest-first page of ledger-derived explanations for the active session's own play-token movements.
      operationId: user_receipts_v2_read
      security:
        - cookieSession: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Self-only play-token receipts with privacy-safe display references and shared pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /me/wellness:
    get:
      summary: Read opt-in wellness preferences for the active session subject.
      operationId: user_wellness_v2_read
      security:
        - cookieSession: []
      responses:
        '200':
          description: Canonical opt-in preferences, cadence bounds, and persistence lifecycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellnessReadEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      summary: Atomically update allowlisted opt-in wellness preferences for the active session subject.
      operationId: user_wellness_v2_update
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellnessPatch'
      responses:
        '200':
          description: Canonical stored preferences after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellnessReadEnvelope'
        '400':
          description: Malformed, empty, out-of-range, or non-allowlisted update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Supplied revision is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /me/wellness/summary:
    get:
      summary: Read neutral committed play-token totals bounded to the server-owned active login session.
      operationId: user_wellness_v2_summary
      security:
        - cookieSession: []
      responses:
        '200':
          description: Plain active-session movement totals with no verdict, advice, or value framing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellnessSummaryEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: casino_session
  schemas:
    Settings:
      type: object
      additionalProperties: false
      required: [locale, sound_enabled, revision, updated_at, persisted]
      properties:
        locale:
          type: string
          enum: [en-US, ru-RU]
        sound_enabled:
          type: boolean
        revision:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
          nullable: true
        persisted:
          type: boolean
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        locale:
          type: string
          enum: [en-US, ru-RU]
        sound_enabled:
          type: boolean
        revision:
          type: integer
          minimum: 0
    HistoryEvent:
      type: object
      additionalProperties: false
      required: [ts, game, reference, transaction_type, amount, balance_after]
      properties:
        ts:
          type: string
          format: date-time
        game:
          type: string
          nullable: true
        reference:
          type: string
          maxLength: 8
          description: Short uppercase correlation tail; never the raw durable round identifier.
        transaction_type:
          type: string
        amount:
          type: number
          description: Signed fake-token movement with no cash value.
        balance_after:
          type: number
          description: Authoritative resulting fake-token balance.
    SettingsReadEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [settings, supported_locales]
          properties:
            settings:
              $ref: '#/components/schemas/Settings'
            supported_locales:
              type: array
              items:
                type: string
                enum: [en-US, ru-RU]
    SettingsUpdateEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [settings]
          properties:
            settings:
              $ref: '#/components/schemas/Settings'
    HistoryEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [events, page, page_size, total, has_more, game]
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/HistoryEvent'
            page:
              type: integer
              minimum: 1
            page_size:
              type: integer
              minimum: 1
              maximum: 50
            total:
              type: integer
              minimum: 0
            has_more:
              type: boolean
            game:
              type: string
    Receipt:
      type: object
      additionalProperties: false
      required: [category, message_key, game, amount, direction, balance_after, occurred_at, reference, play_tokens_only]
      properties:
        category:
          type: string
          enum: [stake, refund, payout, adjustment]
        message_key:
          type: string
          enum: [receipt.stake, receipt.refund, receipt.refund_after_error, receipt.payout, receipt.adjustment]
        game:
          type: string
        amount:
          type: number
          minimum: 0
          description: Unsigned magnitude of the authoritative committed play-token movement.
        direction:
          type: string
          enum: [debit, credit]
        balance_after:
          type: number
          description: Authoritative resulting fake-token balance committed by the ledger.
        occurred_at:
          type: string
          format: date-time
        reference:
          type: string
          maxLength: 8
          description: Short uppercase correlation tail; never the raw durable round identifier.
        play_tokens_only:
          type: boolean
          enum: [true]
    ReceiptEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [receipts, page, page_size, total, has_more]
          properties:
            receipts:
              type: array
              items:
                $ref: '#/components/schemas/Receipt'
            page:
              type: integer
              minimum: 1
            page_size:
              type: integer
              minimum: 1
              maximum: 50
            total:
              type: integer
              minimum: 0
            has_more:
              type: boolean
    WellnessSettings:
      type: object
      additionalProperties: false
      required: [enabled, reminder_interval_minutes, break_reminder_enabled, revision, updated_at, min_interval_minutes, max_interval_minutes, persisted]
      properties:
        enabled:
          type: boolean
          default: false
          description: Explicit opt-in for elapsed-session reminders.
        reminder_interval_minutes:
          type: integer
          minimum: 10
          maximum: 240
          default: 30
        break_reminder_enabled:
          type: boolean
          default: false
          description: Explicit opt-in for a neutral suggested stopping point.
        revision:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
          nullable: true
        min_interval_minutes:
          type: integer
          enum: [10]
        max_interval_minutes:
          type: integer
          enum: [240]
        persisted:
          type: boolean
          description: False for disposable guest-trial responses.
    WellnessPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
        reminder_interval_minutes:
          type: integer
          minimum: 10
          maximum: 240
        break_reminder_enabled:
          type: boolean
        revision:
          type: integer
          minimum: 0
    WellnessReadEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [wellness]
          properties:
            wellness:
              $ref: '#/components/schemas/WellnessSettings'
    WellnessSummary:
      type: object
      additionalProperties: false
      required: [movements, staked, returned, net, since, play_tokens_only]
      properties:
        movements:
          type: integer
          minimum: 0
        staked:
          type: number
          minimum: 0
        returned:
          type: number
          minimum: 0
        net:
          type: number
        since:
          type: string
          format: date-time
        play_tokens_only:
          type: boolean
          enum: [true]
    WellnessSummaryEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/WellnessSummary'
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: object
