openapi: 3.0.3
# Describe the additive issue-155 Pattern Draw contract without changing existing v1 operations.
info:
  title: Virtual Casino Pattern Draw API
  version: v1
  description: Additive session-bound Pattern Draw contract for issue 155, built on the shared exactly-once settlement core.
# Define only game-owned routes; shared router registration remains with issue 77.
paths:
  # Expose session-owned reload state and immutable bet metadata.
  /api/v1/games/pattern-draw/state:
    get:
      summary: Read the authenticated player's Pattern Draw bet catalog and recent settled draws
      operationId: pattern_draw_GET_api_v1_games_pattern_draw_state
      responses:
        '200':
          description: Standard success envelope containing game state, player snapshot, and bet catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternStateEnvelope'
        '401':
          description: Standard error envelope when no authenticated session is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  # Execute one complete debit, grid draw, and optional settlement action.
  /api/v1/games/pattern-draw/draws:
    post:
      summary: Execute or replay one atomic ledger-backed Pattern Draw
      operationId: pattern_draw_POST_api_v1_games_pattern_draw_draws
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatternDrawRequest'
      responses:
        '200':
          description: Standard success envelope containing one settled or safely replayed round
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternDrawEnvelope'
        '400':
          description: Standard error envelope for an invalid pattern or stake or request identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Standard error envelope when no authenticated session is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '409':
          description: Standard error envelope when one request identity is reused with different wager content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
# Keep all request, response, round, and standard-envelope shapes local to this contract.
components:
  schemas:
    # Require a caller-stable action identity, a pattern, and a bounded stake.
    PatternDrawRequest:
      type: object
      additionalProperties: false
      required: [request_id, bet, stake]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Stable caller-generated identity reused only when retrying the same draw action.
        player_id:
          type: string
          description: Compatibility field overridden by the authenticated session-bound player resolver.
        bet:
          type: string
          enum: [line, cross, full]
        stake:
          type: integer
          minimum: 1
          maximum: 100000
          description: Fake-money play-token stake; never currency or redeemable value.
    # Specialize the standard success envelope for state reads.
    PatternStateEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PatternPayload'
    # Specialize the standard success envelope for atomic draw actions.
    PatternDrawEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PatternPayload'
                - type: object
                  required: [round, replayed, ledger]
                  properties:
                    round: {$ref: '#/components/schemas/PatternRound'}
                    replayed: {type: boolean}
                    ledger: {$ref: '#/components/schemas/PatternLedgerEvidence'}
    # Describe the common state, player, and immutable bet metadata payload.
    PatternPayload:
      type: object
      required: [game, state, player, bet_catalog]
      properties:
        game: {type: string, enum: [pattern_draw]}
        state: {type: object}
        player:
          type: object
          description: Current authenticated player's shared read-only wallet snapshot.
        bet_catalog:
          type: object
          description: Cell count and the per-pattern multipliers.
    # Describe one immutable settled round returned on original and replayed requests.
    PatternRound:
      type: object
      required: [round_id, wager, wager_total, entropy, total_return, outcome, detail, net, settled_at]
      properties:
        round_id: {type: string}
        wager:
          type: object
          required: [bet, stake]
          properties:
            bet: {type: string, enum: [line, cross, full]}
            stake: {type: integer, minimum: 1}
        wager_total: {type: number, minimum: 0.01}
        entropy:
          type: object
          required: [grid]
          properties:
            grid:
              type: array
              minItems: 9
              maxItems: 9
              items: {type: integer, minimum: 0, maximum: 1}
        total_return: {type: number, minimum: 0}
        outcome: {type: string, enum: [win, lose]}
        detail:
          type: object
          required: [grid, lit_lines, bet]
          properties:
            grid:
              type: array
              minItems: 9
              maxItems: 9
              items: {type: integer, minimum: 0, maximum: 1}
            lit_lines:
              type: array
              items:
                type: array
                minItems: 3
                maxItems: 3
                items: {type: integer, minimum: 0, maximum: 8}
            bet: {type: string, enum: [line, cross, full]}
        net: {type: number}
        settled_at: {type: string}
    # Preserve scoped wager and optional return event evidence for the settled round.
    PatternLedgerEvidence:
      type: object
      required: [wager, settlement]
      properties:
        wager:
          type: object
          description: Committed aggregate wager debit for this authenticated player and round.
        settlement:
          type: object
          nullable: true
          description: Committed aggregate return credit, or null when the draw lost.
    # Preserve the repository-wide success envelope contract.
    ApiSuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, enum: [true]}
        data: {type: object}
    # Preserve the repository-wide error envelope contract.
    ApiErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: {type: boolean, enum: [false]}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object}
