      summary: GET /api/v1/games/roulette/stats
      operationId: roulette_GET_api_v1_games_roulette_stats
      responses:
        '200':
          description: Standard API envelope response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
components:
  parameters:
    PlayProjection:
      in: query
      name: projection
      required: false
      schema:
        type: string
        enum: [play]
      description: Optional current-client projection that omits only the immutable mode-specific bet catalog; the default response remains unchanged and the catalog stays available from the documented bet-catalog route.
  schemas:
    ApiEnvelope:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        data:
          type: object
        error:
          type: object
