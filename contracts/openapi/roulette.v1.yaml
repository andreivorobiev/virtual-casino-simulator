openapi: 3.0.3
info:
  title: Virtual Casino roulette API
  version: v1
  description: Frozen v1 API contract skeleton for compatibility governance.
paths:
  /api/v1/games/roulette/state:
    get:
      summary: GET /api/v1/games/roulette/state
      operationId: roulette_GET_api_v1_games_roulette_state
      parameters:
        - $ref: '#/components/parameters/PlayProjection'
      responses:
        '200':
          description: Standard API envelope response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/games/roulette/settings:
    post:
      summary: POST /api/v1/games/roulette/settings
      operationId: roulette_POST_api_v1_games_roulette_settings
      parameters:
        - $ref: '#/components/parameters/PlayProjection'
      # BEGIN GENERATED GAME RULE REQUEST BODY
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                mode:
                  type: string
                  enum: ["single","double"]
                zero_rule:
                  type: string
                  enum: ["normal","la_partage","en_prison"]
      # END GENERATED GAME RULE REQUEST BODY
      responses:
        '200':
          description: Standard API envelope response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/games/roulette/bet-catalog:
    get:
      summary: GET /api/v1/games/roulette/bet-catalog
      operationId: roulette_GET_api_v1_games_roulette_bet_catalog
