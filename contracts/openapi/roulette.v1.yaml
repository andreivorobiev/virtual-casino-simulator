  /api/v1/games/roulette/bets:
    post:
      summary: POST /api/v1/games/roulette/bets
      operationId: roulette_POST_api_v1_games_roulette_bets
      parameters:
        - $ref: '#/components/parameters/PlayProjection'
      responses:
        '200':
          description: Standard API envelope response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/games/roulette/call-bet:
    post:
      summary: POST /api/v1/games/roulette/call-bet
      operationId: roulette_POST_api_v1_games_roulette_call_bet
      parameters:
        - $ref: '#/components/parameters/PlayProjection'
      responses:
        '200':
          description: Standard API envelope response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/games/roulette/rebet:
    post:
      summary: POST /api/v1/games/roulette/rebet
      operationId: roulette_POST_api_v1_games_roulette_rebet
      parameters:
        - $ref: '#/components/parameters/PlayProjection'
      responses:
        '200':
          description: Standard API envelope response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/games/roulette/bets/{bet_id}:
    delete:
      summary: DELETE /api/v1/games/roulette/bets/{bet_id}
      operationId: roulette_DELETE_api_v1_games_roulette_bets_bet_id
      parameters:
        - $ref: '#/components/parameters/PlayProjection'
      responses:
        '200':
          description: Standard API envelope response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/games/roulette/clear:
    post:
      summary: POST /api/v1/games/roulette/clear
      operationId: roulette_POST_api_v1_games_roulette_clear
