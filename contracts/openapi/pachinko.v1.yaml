openapi: 3.0.3
# Describe the additive issue-142 Pachinko contract without changing existing v1 operations.
info:
  title: Virtual Casino Pachinko API
  version: v1
  description: Additive session-bound Pachinko contract for issue 142, built on the shared exactly-once settlement core.
# Define only game-owned routes; shared router registration remains with issue 77.
paths:
  # Expose session-owned reload state and immutable pocket metadata.
  /api/v1/games/pachinko/state:
    get:
      summary: Read the authenticated player's Pachinko pocket catalog and recent settled drops
      operationId: pachinko_GET_api_v1_games_pachinko_state
      responses:
        '200':
          description: Standard success envelope containing game state, player snapshot, and pocket catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PachinkoStateEnvelope'
        '401':
          description: Standard error envelope when no authenticated session is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  # Execute one complete debit, twelve-row drop, and optional settlement action.
  /api/v1/games/pachinko/drops:
    post:
      summary: Execute or replay one atomic ledger-backed Pachinko drop
      operationId: pachinko_POST_api_v1_games_pachinko_drops
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PachinkoDropRequest'
      responses:
        '200':
          description: Standard success envelope containing one settled or safely replayed round
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PachinkoDropEnvelope'
        '400':
          description: Standard error envelope for an invalid stake or request identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Standard error envelope when no authenticated session is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '409':
          description: Standard error envelope when one request identity is reused with different wager content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
# Keep all request, response, round, and standard-envelope shapes local to this contract.
components:
  schemas:
    # Require a caller-stable action identity and a bounded whole-drop stake.
    PachinkoDropRequest:
      type: object
      additionalProperties: false
      required: [request_id, stake]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Stable caller-generated identity reused only when retrying the same drop action.
        player_id:
          type: string
          description: Compatibility field overridden by the authenticated session-bound player resolver.
        stake:
          type: integer
          minimum: 1
          maximum: 100000
          description: Fake-money play-token stake for the whole drop; never currency or redeemable value.
    # Specialize the standard success envelope for state reads.
    PachinkoStateEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PachinkoPayload'
    # Specialize the standard success envelope for atomic drop actions.
    PachinkoDropEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PachinkoPayload'
                - type: object
                  required: [round, replayed, ledger]
                  properties:
                    round: {$ref: '#/components/schemas/PachinkoRound'}
                    replayed: {type: boolean}
                    ledger: {$ref: '#/components/schemas/PachinkoLedgerEvidence'}
    # Describe the common state, player, and immutable pocket metadata payload.
    PachinkoPayload:
      type: object
      required: [game, state, player, bet_catalog]
      properties:
        game: {type: string, enum: [pachinko]}
        state: {type: object}
        player:
          type: object
          description: Current authenticated player's shared read-only wallet snapshot.
        bet_catalog:
          type: object
          description: Row count and the thirteen pocket multipliers.
    # Describe one immutable settled round returned on original and replayed requests.
    PachinkoRound:
      type: object
      required: [round_id, wager, wager_total, entropy, total_return, outcome, detail, net, settled_at]
      properties:
        round_id: {type: string}
        wager:
          type: object
          required: [stake]
          properties:
            stake: {type: integer, minimum: 1}
        wager_total: {type: number, minimum: 0.01}
        entropy:
          type: object
          required: [path, pocket]
          properties:
            path:
              type: array
              minItems: 12
              maxItems: 12
              items: {type: string, enum: [L, R]}
            pocket: {type: integer, minimum: 0, maximum: 12}
        total_return: {type: number, minimum: 0}
        outcome: {type: string, enum: [win, lose, push]}
        detail:
          type: object
          required: [pocket, path, multiplier]
          properties:
            pocket: {type: integer, minimum: 0, maximum: 12}
            path:
              type: array
              minItems: 12
              maxItems: 12
              items: {type: string, enum: [L, R]}
            multiplier: {type: number, minimum: 0}
        net: {type: number}
        settled_at: {type: string}
    # Preserve scoped wager and optional return event evidence for the settled round.
    PachinkoLedgerEvidence:
      type: object
      required: [wager, settlement]
      properties:
        wager:
          type: object
          description: Committed aggregate wager debit for this authenticated player and round.
        settlement:
          type: object
          nullable: true
          description: Committed aggregate return credit, or null when the drop returned nothing.
    # Preserve the repository-wide success envelope contract.
    ApiSuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, enum: [true]}
        data: {type: object}
    # Preserve the repository-wide error envelope contract.
    ApiErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: {type: boolean, enum: [false]}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object}
