# Retain this legacy filename while exposing one vendor-neutral bounded task form.
name: Agent task
description: Create a structured task issue for one human, Claude, Codex, or approved worker.
labels:
  - coordination
body:
  # Explain the durable task model before collecting assignment fields.
  - type: markdown
    attributes:
      value: |
        Use this for one bounded worker task. Codex is the coordinator and sole merge executor. The issue must contain enough context for a worker to act without relying on prior chat history.
  # Identify the system that will author the branch and pull request.
  - type: dropdown
    id: authoring_system
    attributes:
      label: Authoring system
      description: Who will compose the pull request?
      options:
        - Claude
        - Codex
        - Human
        - Other approved worker
    validations:
      required: true
  # Capture module scope before behavioral requirements.
  - type: input
    id: module
    attributes:
      label: Module
      description: Which module is impacted?
      placeholder: roulette, slots, docs, tooling, contracts
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirement IDs
      description: List requirement IDs added, changed, or validated.
      placeholder: |
        Added: None
        Changed: ROU-001
        Validated: TEST-017
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the requested change, including explicit non-goals.
      placeholder: |
        Goal:
        Non-goals:
        User-visible behavior:
    validations:
      required: true
  - type: textarea
    id: file_ownership
    attributes:
      label: File ownership
      description: List owned files, no-touch files, and allowed adjacent files for this worker.
      placeholder: |
        Owned files:
        No-touch files:
        Allowed adjacent files:
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: State API, gameplay, ledger, bot, autoplay, data, security, release, and deployment impact.
      placeholder: |
        API contract impact:
        Gameplay impact:
        Ledger impact:
        Bot/autoplay impact:
        Data migration impact:
        Security/privacy impact:
        Release impact:
        Deployment/provider impact:
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      description: Expected branch name for this task.
      placeholder: claude/267-roulette-ui-history
    validations:
      required: true
  - type: textarea
    id: coordination
    attributes:
      label: Coordination notes
      description: List parallel workers, stacked PR dependencies, or blockers.
      placeholder: |
        Base branch and commit:
        Parallel workers:
        Dependency PRs and exact heads:
        Blocks:
        Required owner approval:
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation required
      description: List tests and docs that must be updated.
      placeholder: |
        Required scripts:
        API tests:
        Browser tests:
        Visual matrix rows/locales/viewports:
        Manual checks:
        Cleanup evidence:
    validations:
      required: true
  # Make the terminal author-to-Codex handback explicit.
  - type: textarea
    id: handback
    attributes:
      label: PR handback required
      description: Define the exact evidence Claude or another author must hand to Codex without merging.
      placeholder: |
        Exact head SHA:
        Required PR summary:
        Evidence:
        Open risks or decisions:
        Requested next action: Codex review and merge when eligible
    validations:
      required: true
