name: Docs
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run checks
        run: |
          python scripts/generate_docs.py --check
