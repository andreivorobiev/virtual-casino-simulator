name: Docs
on:
  pull_request:
  push:
    branches: [ main ]
  # Permit the bounded duration-profile publisher to qualify its GITHUB_TOKEN-authored branch.
  workflow_dispatch:
# Cancel superseded runs for the same pull request; pushes and dispatches keep unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run checks
        run: |
          python scripts/assemble_requirements.py --check
          python scripts/generate_docs.py --check
