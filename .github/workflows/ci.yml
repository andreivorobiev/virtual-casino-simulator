name: CI
on:
  pull_request:
  push:
    branches: [ main ]
# Cancel superseded runs for the same pull request; pushes and dispatches keep unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Provide an isolated disposable database for storage-provider transaction evidence.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: casino_ci_root_password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcasino_ci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CASINO_STORAGE_PROVIDER: json
      # Mark this job's newly created MySQL service as disposable before migration tests may connect.
      CASINO_MYSQL_DISPOSABLE_TEST: 1
      # Supply a synthetic ephemeral administrator only to the isolated live-test harness.
      CASINO_MYSQL_TEST_ADMIN_HOST: 127.0.0.1
      CASINO_MYSQL_TEST_ADMIN_PORT: 3306
      CASINO_MYSQL_TEST_ADMIN_USER: root
      CASINO_MYSQL_TEST_ADMIN_PASSWORD: casino_ci_root_password
      # Supply a separate synthetic deployment-only migration identity.
      CASINO_MYSQL_MIGRATION_HOST: 127.0.0.1
      CASINO_MYSQL_MIGRATION_PORT: 3306
      CASINO_MYSQL_MIGRATION_USER: casino_migrator_204
      CASINO_MYSQL_MIGRATION_PASSWORD: casino_ci_migrator_password
      CASINO_MYSQL_MIGRATION_DATABASE: casino_base_204
      # Use a CI-only HMAC key that is distinct from every database password.
      CASINO_MYSQL_MIGRATION_TARGET_BINDING_KEY: casino_ci_target_binding_key_material_204_only
      # Supply the DDL-free synthetic runtime identity created by the live matrix.
      CASINO_MYSQL_HOST: 127.0.0.1
      CASINO_MYSQL_PORT: 3306
      CASINO_MYSQL_USER: casino_runtime_204
      CASINO_MYSQL_PASSWORD: casino_ci_runtime_password
      CASINO_MYSQL_DATABASE: casino_base_204
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dev requirements
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[mysql,recovery]"
      - name: Run checks
        run: |
          python -m py_compile run.py verify_rules.py tests/run_tests.py $(find casino scripts -name "*.py")
          python scripts/validate_pr_issue_lifecycle.py
          python -m unittest tests.issue_lifecycle_tests
          python verify_rules.py
          python -m unittest tests.test_progress
          python tests/run_tests.py --storage --mysql-migrations-live
          python tests/run_tests.py --api
          python scripts/validate_game_catalog.py
          python scripts/validate_requirements.py
          python scripts/validate_versions.py
      # Provide a JavaScript runtime for the frontend contract suites. (issue #413)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Execute the per-game and embedded module suites that no workflow previously ran. (issue #413)
      - name: Per-game and embedded Python suites
        run: |
          python -m unittest discover -s tests/games -p "test_*.py" -t .
          python -m unittest discover -s casino/games -p "test_*.py" -t .
      # Execute every tracked frontend .mjs suite that no workflow previously ran. (issue #413)
      - name: Frontend module suites
        run: |
          node --test "tests/games/**/test_frontend.mjs" "tests/unit/*.test.mjs" "tests/security/test_browser_api.mjs" "casino/games/**/tests/*.mjs"
