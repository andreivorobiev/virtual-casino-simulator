name: Comment Density
on:
  pull_request:
  push:
    branches: [ main ]
# Cancel superseded runs for the same pull request; pushes and dispatches keep unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  comment_density:
    runs-on: ubuntu-latest
    steps:
      # Fetch the merge/base parent so filler-debt ledger increases can be rejected monotonically.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run file-header and terminology checks
        run: |
          # Compare with the parent ledger after #713 establishes it; the first introduction has no prior file.
          if git cat-file -e HEAD^:scripts/comment_filler_baseline.json 2>/dev/null; then
            git show HEAD^:scripts/comment_filler_baseline.json > "$RUNNER_TEMP/comment_filler_baseline.json"
            python scripts/check_file_headers.py --check --previous-filler-baseline "$RUNNER_TEMP/comment_filler_baseline.json"
          else
            python scripts/check_file_headers.py --check
          fi
          python scripts/validate_token_terminology.py
