name: Release
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Application version to package'
        required: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Build release artifacts
        run: python scripts/make_release.py --app-version ${{ github.event.inputs.app_version }}
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-casino-release
          path: dist/
